# 250M Unshared (Baseline) Configuration
# Standard model without weight sharing for comparison
# Ported from old torchtitan llama3 config

[job]
dump_folder = "./outputs"
description = "250M Unshared Baseline Run"

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace_unshared"
profile_freq = 100

[metrics]
log_freq = 10
enable_tensorboard = false
enable_wandb = true
save_tb_folder = "tb"

[model]
name = "qwen3"
flavor = "250M_unshared"
hf_assets_path = "./assets/hf/Qwen3-0.6B-Base"

[optimizer]
name = "AdamW"
lr = 3e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 2000
decay_ratio = 0.8
decay_type = "cosine"
min_lr_factor = 0.1

[training]
local_batch_size = 22
seq_len = 2048
max_norm = 1.0
steps = 55500
dataset = "fw_edu"
mixed_precision_param = "bfloat16"
mixed_precision_reduce = "float32"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = 1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1
context_parallel_degree = 1

[checkpoint]
enable = true
folder = "250m_unshared_checkpoints"
interval = 500
last_save_model_only = true
export_dtype = "float32"
async_mode = "disabled"

[activation_checkpoint]
mode = "none"
selective_ac_option = "op"

[compile]
enable = true

[validation]
enable = false
dataset = "fw_edu_val"
freq = 100
steps = -1
