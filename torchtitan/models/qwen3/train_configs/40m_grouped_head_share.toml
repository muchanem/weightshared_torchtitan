# 40M Grouped Head Sharing Configuration
# Tests attention head sharing with grouped templates
# Ported from old torchtitan llama3 config

[job]
dump_folder = "./outputs"
description = "40M Grouped Head Sharing Debug"
custom_config_module = "torchtitan.models.qwen3.job_config"

[profiling]
enable_profiling = true
save_traces_folder = "profile_trace_shared"
profile_freq = 100

[metrics]
log_freq = 10
enable_tensorboard = false
enable_wandb = true
save_tb_folder = "tb"

[model]
name = "qwen3"
flavor = "40M"
hf_assets_path = "./assets/hf/Qwen3-0.6B-Base"

[optimizer]
name = "AdamW"
lr = 3e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 200

[training]
local_batch_size = 4
seq_len = 8192
max_norm = 1.0
steps = 1000
dataset = "c4"
mixed_precision_param = "bfloat16"
mixed_precision_reduce = "float32"

[parallelism]
data_parallel_replicate_degree = 8
data_parallel_shard_degree = 1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1
context_parallel_degree = 1

# Weight sharing configuration - attention sharing only
[weight_sharing.attention]
enabled = true
head_sharing = true
grouping = 2  # 2 template heads shared across all heads
rank = 8
two_step = false

[weight_sharing.layer]
enabled = false

[weight_sharing.embedding]
enabled = true
d_emb = 128
tie_output = true

[checkpoint]
enable = false
folder = "checkpoint"
interval = 500
last_save_model_only = true
export_dtype = "float32"
async_mode = "disabled"

[activation_checkpoint]
mode = "selective"
selective_ac_option = "op"

[compile]
enable = true

[validation]
enable = false
dataset = "c4_validation"
freq = 100
steps = -1

