# Debug configuration for Qwen3 with weight sharing
# Use this for fast iteration and testing of weight sharing features

[job]
dump_folder = "./outputs"
description = "Qwen3 debug model with weight sharing"
custom_config_module = "torchtitan.models.qwen3.job_config"

[metrics]
log_freq = 10
enable_tensorboard = false
enable_wandb = false

[model]
name = "qwen3"
flavor = "debugmodel_weightshared"
# Using default HF tokenizer path, update if needed
# hf_assets_path = "path/to/tokenizer"

[optimizer]
name = "AdamW"
lr = 3e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 10

[training]
local_batch_size = 2
seq_len = 512
steps = 20
dataset = "c4_test"
mixed_precision_param = "bfloat16"
mixed_precision_reduce = "float32"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
# Pipeline parallelism disabled - required for weight sharing
pipeline_parallel_degree = 1
context_parallel_degree = 1

# Weight sharing configuration
[weight_sharing.attention]
enabled = true
head_sharing = true
grouping = 4
rank = 8
two_step = false
# qkv_sharing = [["q", "k", "v"]]  # Uncomment to tie Q, K, V together

[weight_sharing.layer]
enabled = true
# Layer groups: first layer unique, middle 6 layers shared, last layer unique
layer_groups = [[0], [1, 2, 3, 4, 5, 6], [7]]
lora_rank = 8

[weight_sharing.embedding]
enabled = true
d_emb = 64
tie_output = true

[activation_checkpoint]
mode = "none"

[checkpoint]
enable = false

[compile]
enable = true

[debug]
moe_force_load_balance = false
