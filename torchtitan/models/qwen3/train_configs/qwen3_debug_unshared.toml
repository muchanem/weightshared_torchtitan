# Debug configuration for Qwen3 WITHOUT weight sharing (baseline)
# Use this for comparison with weight-shared version

[job]
dump_folder = "./outputs"
description = "Qwen3 debug model without weight sharing (baseline)"

[metrics]
log_freq = 10
enable_tensorboard = false
enable_wandb = false

[model]
name = "qwen3"
flavor = "debugmodel"
# Using default HF tokenizer path

[optimizer]
name = "AdamW"
lr = 3e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 10

[training]
local_batch_size = 2
seq_len = 512
steps = 20
dataset = "c4_test"
mixed_precision_param = "bfloat16"
mixed_precision_reduce = "float32"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1
context_parallel_degree = 1

[activation_checkpoint]
mode = "none"

[checkpoint]
enable = false

[compile]
enable = true
